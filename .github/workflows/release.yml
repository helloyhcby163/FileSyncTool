name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: FileSyncTool_v7.8.0_Windows.exe
            artifact_name: Windows
          - os: macos-15-intel
            output_name: FileSyncTool_v7.8.0_macOS_Intel
            artifact_name: macOS_Intel
          - os: macos-latest
            output_name: FileSyncTool_v7.8.0_macOS_ARM64
            artifact_name: macOS_ARM64
          - os: ubuntu-latest
            output_name: FileSyncTool_v7.8.0_Linux
            artifact_name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller cryptography psutil

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller FileSyncTool.spec || { echo "❌ PyInstaller Build Failed!"; ls -la dist; exit 1; }

      # ---------- Windows / Linux 重命名 ----------
      - name: Package Artifacts (Windows/Linux)
        if: matrix.os == 'windows-latest' || matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist
          if [ -f "main.exe" ]; then mv "main.exe" "${{ matrix.output_name }}"; fi
          if [ -f "main" ]; then mv "main" "${{ matrix.output_name }}"; fi
          ls -la

      # ---------- macOS 打包 ----------
      - name: Package Artifacts (macOS)
        if: matrix.os == 'macos-15-intel' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          if [ -d "main.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "main.app" "${{ matrix.output_name }}.zip"
          elif [ -f "main" ]; then
            mv "main" "${{ matrix.output_name }}"
          else
            echo "❌ 未找到打包产物"
            ls -la
            exit 1
          fi
          ls -la

      # ---------- 🚨 自动 Ed25519 签名 ----------
      - name: Sign Artifacts
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          cd dist
          TARGET_FILE="${{ matrix.output_name }}"
          if [[ "${{ matrix.os }}" == macos* ]]; then
             TARGET_FILE="${{ matrix.output_name }}.zip"
          fi
          
          python -c "
          import os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          
          pem_data = os.environ.get('PRIVATE_KEY', '')
          if not pem_data:
              print('❌ 未找到 PRIVATE_KEY，跳过签名')
              exit(1)
              
          private_key = serialization.load_pem_private_key(pem_data.encode(), password=None)
          target_file = '$TARGET_FILE'
          
          if not os.path.exists(target_file):
              print(f'❌ 找不到要签名的文件: {target_file}')
              exit(1)
              
          print(f'正在签名文件: {target_file}')
          with open(target_file, 'rb') as f:
              data = f.read()
          signature = private_key.sign(data)
          
          with open(target_file + '.sig', 'wb') as f:
              f.write(signature)
          print('✅ 签名文件生成成功')
          "

      # ---------- 上传 Artifact ----------
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.output_name }}*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          generate_release_notes: true

  sync-to-gitee:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Gitee Release
        id: create_release
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: ${{ github.ref_name }}
          gitee_release_body: "Release ${{ github.ref_name }}"
          gitee_target_commitish: master
          
      - name: Upload Assets to Gitee
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_upload_retry_times: 3
          gitee_files: |
            artifacts/*/*