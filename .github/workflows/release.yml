name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: FileSyncTool_v7.7_Windows.exe
          - os: macos-14
            output_name: FileSyncTool_v7.7_macOS_ARM64
          - os: macos-15-intel
            output_name: FileSyncTool_v7.7_macOS_Intel
          - os: ubuntu-latest
            output_name: FileSyncTool_v7.7_Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (spec file)
        run: |
          pyinstaller FileSyncTool.spec

      - name: Rename output
        run: |
          if [ -f "dist/main.exe" ]; then mv dist/main.exe "dist/${{ matrix.output_name }}"; fi
          if [ -f "dist/main" ]; then mv dist/main "dist/${{ matrix.output_name }}"; fi
        shell: bash

      - name: Create ZIP
        run: |
          cd dist
          if [ -f "${{ matrix.output_name }}" ]; then
            if command -v 7z &> /dev/null; then
              7z a "${{ matrix.output_name }}.zip" "${{ matrix.output_name }}"
            else
              zip -r "${{ matrix.output_name }}.zip" "${{ matrix.output_name }}"
            fi
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          generate_release_notes: true

  sync-to-gitee:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Gitee Release
        id: create_release  # ⚠️ 必须加这一行，下面才能拿到 ID
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: ${{ github.ref_name }}
          gitee_release_body: "Release ${{ github.ref_name }}"

      - name: Upload Assets to Gitee
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_upload_retry_times: 3
          gitee_files: |
            artifacts/*/*