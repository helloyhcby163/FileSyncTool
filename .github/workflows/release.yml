name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: FileSyncTool_v7.8.0_Windows.exe
            artifact_name: Windows
          # ✅ 正确的 Intel macOS runner 标签
          - os: macos-15-intel
            output_name: FileSyncTool_v7.8.0_macOS_Intel
            artifact_name: macOS_Intel
          - os: macos-14
            output_name: FileSyncTool_v7.8.0_macOS_ARM64
            artifact_name: macOS_ARM64
          - os: ubuntu-latest
            output_name: FileSyncTool_v7.8.0_Linux
            artifact_name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller FileSyncTool.spec

      # ---------- Windows / Linux ----------
      - name: Package Artifacts (Windows/Linux)
        if: matrix.os == 'windows-latest' || matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist
          # ⚠️ 请根据 FileSyncTool.spec 中的 name 参数修改此处！
          # 如果 spec 里写的是 name='FileSyncTool'，则源文件是 FileSyncTool.exe / FileSyncTool
          if [ -f "FileSyncTool.exe" ]; then mv "FileSyncTool.exe" "${{ matrix.output_name }}"; fi
          if [ -f "FileSyncTool" ]; then mv "FileSyncTool" "${{ matrix.output_name }}"; fi

      # ---------- macOS ----------
      - name: Package Artifacts (macOS)
        if: matrix.os == 'macos-15-intel' || matrix.os == 'macos-14'
        shell: bash
        run: |
          cd dist
          # 如果 spec 生成的是 .app 目录，用 ditto 压缩为 zip
          if [ -d "FileSyncTool.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "FileSyncTool.app" "${{ matrix.output_name }}.zip"
            echo "PACKAGED_AS=zip" >> $GITHUB_ENV
          # 如果 spec 生成的是单个 Unix 可执行文件，直接重命名
          elif [ -f "FileSyncTool" ]; then
            mv "FileSyncTool" "${{ matrix.output_name }}"
            echo "PACKAGED_AS=binary" >> $GITHUB_ENV
          else
            echo "❌ 未找到打包产物，请检查 FileSyncTool.spec 的 name 参数"
            ls -la
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.output_name }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          generate_release_notes: true

  sync-to-gitee:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Gitee Release
        id: create_release
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: ${{ github.ref_name }}
          gitee_release_body: "Release ${{ github.ref_name }}"
          gitee_target_commitish: master  # ✅ 保留，避免 Gitee 创建 Release 时报错

      - name: Upload Assets to Gitee
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: hello-yhc
          gitee_repo: FileSyncTool
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_upload_retry_times: 3
          gitee_files: |
            artifacts/*/*